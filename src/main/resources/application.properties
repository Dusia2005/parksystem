# PostgreSQL connection (\u0442\u043E\u043B\u044C\u043A\u043E \u0434\u043B\u044F \u0441\u043F\u0440\u0430\u0432\u043A\u0438, \u043D\u0435 \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u0435\u0442\u0441\u044F \u0432 ConnectionPool \u043D\u0430\u043F\u0440\u044F\u043C\u0443\u044E)
# \u042D\u0442\u0438 \u043F\u0430\u0440\u0430\u043C\u0435\u0442\u0440\u044B \u043C\u043E\u0436\u043D\u043E \u0443\u0434\u0430\u043B\u0438\u0442\u044C, \u0435\u0441\u043B\u0438 \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u0435\u0448\u044C \u0442\u043E\u043B\u044C\u043A\u043E \u0441\u0430\u043C\u043E\u043F\u0438\u0441\u043D\u044B\u0439 ConnectionPool
# spring.datasource.url=jdbc:postgresql://localhost:5432/MyPark
# spring.datasource.username=postgres
# spring.datasource.password=1234
# spring.datasource.driver-class-name=org.postgresql.Driver

# \u041E\u0442\u043A\u043B\u044E\u0447\u0435\u043D\u0438\u0435 JPA/Hibernate, \u0435\u0441\u043B\u0438 \u043D\u0435 \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u0435\u0442\u0441\u044F
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# \u041F\u043E\u0434\u0434\u0435\u0440\u0436\u043A\u0430 UTF-8 \u0438 \u043A\u0438\u0440\u0438\u043B\u043B\u0438\u0446\u044B
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# \u0421\u0435\u0440\u0432\u0435\u0440
server.address=0.0.0.0

# \u041F\u0430\u043F\u043A\u0430 \u0434\u043B\u044F \u0445\u0440\u0430\u043D\u0435\u043D\u0438\u044F \u0438\u043A\u043E\u043D\u043E\u043A \u0440\u0430\u0441\u0442\u0435\u043D\u0438\u0439 (\u043E\u0442\u043D\u043E\u0441\u0438\u0442\u0435\u043B\u044C\u043D\u043E \u0440\u0430\u0431\u043E\u0447\u0435\u0433\u043E \u043A\u0430\u0442\u0430\u043B\u043E\u0433\u0430 \u043F\u0440\u0438\u043B\u043E\u0436\u0435\u043D\u0438\u044F)
app.upload.dir=uploads/plants

# \u041E\u0433\u0440\u0430\u043D\u0438\u0447\u0435\u043D\u0438\u044F
app.upload.max-size-bytes=20480
app.upload.max-width=64
app.upload.max-height=64

