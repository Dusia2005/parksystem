<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
  <title th:text="${plant.id != null} ? 'Редактировать растение' : 'Добавить растение'">Форма растения</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
<section layout:fragment="content">
  <div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow">
      <div class="card-body">
        <h3 class="card-title mb-4 text-center" th:text="${plant.id != null} ? '✏️ Редактировать растение' : '➕ Добавить растение'"></h3>

        <form th:action="@{${plant.id} != null ? '/plants/update/' + ${plant.id} : '/plants/new'}"
              th:object="${plant}" method="post">

          <!-- Ошибка при повторе названия -->
          <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

          <!-- Название -->
          <div class="mb-3">
            <label for="name" class="form-label">Название растения</label>
            <input type="text" th:field="*{name}" class="form-control" id="name" required placeholder="Например, сосна">
          </div>

          <div class="d-flex justify-content-between">
            <a href="/plants" class="btn btn-secondary">← Назад</a>
            <button type="submit" class="btn btn-success">
              <span th:text="${plant.id != null} ? 'Сохранить изменения' : 'Добавить'"></span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
