<!-- Форма для добавления, редактирования определенного растения  -->
<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="${plant.id != null} ? 'Редактировать растение' : 'Добавить растение'">Форма растения</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<section layout:fragment="content">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow">
            <div class="card-body">

                <!-- Заголовок -->
                <h3 class="card-title mb-4 text-center"
                    th:text="${plant.id != null} ? '✏️ Редактировать растение' : '➕ Добавить растение'"></h3>

                <!-- Основная форма -->
                <form th:if="${needDefaultChoice == null or !needDefaultChoice}"
                      th:action="@{${plant.id} != null ? '/plants/update/' + ${plant.id} : '/plants/new'}"
                      th:object="${plant}"
                      method="post"
                      enctype="multipart/form-data">

                    <!-- Ошибка -->
                    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

                    <!-- Название растения -->
                    <div class="mb-3">
                        <label for="name" class="form-label">Название растения</label>
                        <input type="text" th:field="*{name}" class="form-control" id="name"
                               required placeholder="Например, сосна">
                    </div>

                    <!-- Загрузка файла -->
                    <input type="file" name="imageFile" id="imageFile"
                           accept="image/png, image/jpeg, image/webp"
                           class="form-control mb-2"/>

                    <!-- Превью изображения -->
                    <img th:if="${plant.imageFilename != null}"
                         th:src="@{'/plants/image/' + ${plant.imageFilename}}"
                         alt="preview"
                         style="width:48px;height:48px;object-fit:contain;border:1px solid #ddd;padding:4px;">

                    <!-- Кнопки -->
                    <div class="d-flex justify-content-between mt-3">
                        <a href="/plants" class="btn btn-secondary">← Назад</a>
                        <button type="submit" class="btn btn-success"
                                th:text="${plant.id != null} ? 'Сохранить изменения' : 'Добавить'"></button>
                    </div>
                </form>

                <!-- БЛОК: Пользователь не выбрал файл → спросить про дефолт -->
                <div th:if="${needDefaultChoice}" class="alert alert-warning mt-3 p-3">
                    <h5 class="mb-2">Вы не выбрали изображение.</h5>
                    <p>Хотите использовать дерево по умолчанию?</p>

                    <!-- Отдельная форма (НЕ вложенная внутрь основной!) -->
                    <form th:action="@{/plants/new}" method="post">
                        <input type="hidden" name="name" th:value="${plant.name}">
                        <input type="hidden" name="useDefault" value="true">

                        <button type="submit" class="btn btn-primary">Да, использовать</button>
                    </form>

                    <a href="/plants/new" class="btn btn-secondary mt-2">Нет, вернуться назад</a>
                </div>

            </div>
        </div>
    </div>
</section>
</body>
</html>
