<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="${plant.id != null} ? 'Редактировать растение' : 'Добавить растение'"></title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<section layout:fragment="content">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow">
            <div class="card-body">

                <h3 class="card-title mb-4 text-center"
                    th:text="${plant.id != null} ? '✏️ Редактировать растение' : '➕ Добавить растение'"></h3>

                <form th:action="@{${plant.id} != null ? '/plants/update/' + ${plant.id} : '/plants/new'}"
                      th:object="${plant}"
                      method="post">

                    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

                    <!-- Название -->
                    <div class="mb-3">
                        <label class="form-label">Название растения</label>
                        <input type="text" th:field="*{name}" class="form-control" required>
                    </div>

                    <!-- Выбор картинки -->
                    <div class="mb-3">
                        <label class="form-label">Картинка</label>
                        <select class="form-select" th:field="*{imageFilename}" required>
                            <option disabled selected value="">-- выберите файл --</option>
                            <option th:each="img : ${images}"
                                    th:value="${img}"
                                    th:text="${img}">
                            </option>
                        </select>
                    </div>

                    <!-- Превью -->
                    <img th:if="${plant.imageFilename != null}"
                         th:src="@{'/assets/plants/' + ${plant.imageFilename}}"
                         style="width:48px;height:48px;object-fit:contain;border:1px solid #ccc;padding:4px;">

                    <div class="d-flex justify-content-between mt-3">
                        <a href="/plants" class="btn btn-secondary">← Назад</a>
                        <button type="submit" class="btn btn-success"
                                th:text="${plant.id != null} ? 'Сохранить' : 'Добавить'"></button>
                    </div>

                </form>

            </div>
        </div>
    </div>
</section>
</body>
</html>
