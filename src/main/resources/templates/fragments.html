<!-- fragments.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Меню -->
<div th:fragment="sidebar">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container px-4">
      <a class="navbar-brand" href="/">Лесная система</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" th:href="@{/}">Главная</a></li>
          <!-- Для лесника -->
          <li class="nav-item" th:if="${#authorization.expression('hasRole(''FORESTER'')')}">
            <a class="nav-link" th:href="@{/tasks/forester/tasks}">Мои задачи</a>
          </li>
          <li class="nav-item" th:if="${#authorization.expression('hasRole(''FORESTER'')')}">
          <a class="nav-link" th:href="@{/reports}">Отчёты</a>
          </li>
          <!-- Для владельца -->
          <li class="nav-item" th:if="${#authorization.expression('hasRole(''OWNER'')')}">
            <a class="nav-link" th:href="@{/tasks}">Задачи</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" th:href="@{/login}">Войти</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</div>

<!-- Подвал -->
<div th:fragment="footer">
  <footer class="bg-dark py-3 text-white text-center mt-auto">
    <div class="container">
      &copy; Лесная система 2025
    </div>
  </footer>
</div>
</html>
