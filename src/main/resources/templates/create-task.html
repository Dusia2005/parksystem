<!-- Создание новой задачи -->
<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
  <title>Создать задачу</title>
</head>
<body>
<section layout:fragment="content">
  <div class="container mt-5" style="max-width: 700px;">
    <h2>Создание новой задачи</h2>

    <!-- Форма создания задачи -->
    <form th:action="@{/tasks/new}" method="post" th:object="${task}">

      <!-- Поле описания -->
      <div class="mb-3">
        <label th:for="*{description}" class="form-label">Описание</label>
        <textarea class="form-control" th:field="*{description}" required></textarea>
      </div>

      <!-- Выбор лесника -->
      <div class="mb-3">
        <label th:for="*{foresterId}" class="form-label">Лесник</label>
        <select class="form-select" th:field="*{foresterId}" required>
          <option th:each="user : ${foresters}" th:value="${user.id}" th:text="${user.username}"></option>
        </select>
      </div>

      <!-- Ввод/выбор растения -->
      <div class="mb-3">
        <label th:for="*{plantName}" class="form-label">Растение</label>
          <input list="plants" id="plantInput" name="plantName" class="form-control" required />
        <datalist id="plants">
          <option th:each="plant : ${allowedPlants}" th:value="${plant.name}" />
        </datalist>
      </div>

      <!-- Выбор действия -->
      <div class="mb-3">
        <label th:for="*{action}" class="form-label">Действие</label>
        <select id="action" class="form-select" th:field="*{action}" onchange="updatePlantField()">
          <option value="PLANTING">Посадка</option>
          <option value="CUTTING">Вырубка</option>
          <option value="WATERING">Полив</option>
          <option value="FIRE_EXTINGUISHING">Тушение пожара</option>
          <option value="PATROLLING">Обход</option>
        </select>
      </div>

        <div class="mb-3">
            <label class="form-label">Отметьте место на карте:</label>
            <div style="position: relative; display: inline-block;">
                <!-- Контейнер карты с деревьями -->
                <div id="mapContainer" style="position: relative;">
                    <img src="/assets/les.jpg" id="map" style="width: 100%; max-width: 600px; display: block;" />

                    <!-- Контейнер для маркеров (деревьев) -->
                    <div id="markersContainer" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;">
                        <!-- Динамически добавляемые маркеры будут здесь -->
                    </div>

                    <!-- Маркер для новой задачи -->
                    <div id="taskMarker" style="position: absolute; font-size: 24px; z-index: 10; pointer-events: none;"></div>
                </div>
            </div>
        </div>


      <!-- Скрытые поля для координат -->
      <input type="hidden" th:field="*{coordX}" id="coordX"/>
      <input type="hidden" th:field="*{coordY}" id="coordY"/>

      <!-- Кнопки -->
      <button type="submit" class="btn btn-success">Создать задачу</button>
      <a href="/tasks/owner-tasks" class="btn btn-secondary">Назад к задачам</a>
    </form>

    <!-- Уведомления -->
    <div th:if="${success}" class="alert alert-success mt-3" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger mt-3" th:text="${error}"></div>
  </div>

  <!-- Скрипт для выбора точки на карте -->
    <script th:inline="javascript">
        let currentIcon = '🌱';
        const mapContainer = document.getElementById('mapContainer');
        const map = document.getElementById('map');
        const markersContainer = document.getElementById('markersContainer');
        const taskMarker = document.getElementById('taskMarker');

        // Функция установки иконки в зависимости от действия
        function setIcon() {
            const action = document.getElementById('action').value;
            switch (action) {
                case 'CUTTING': currentIcon = '❌'; break;
                case 'WATERING': currentIcon = '💧'; break;
                case 'PLANTING': currentIcon = '🌱'; break;
                case 'PATROLLING': currentIcon = '🚶'; break;
                case 'FIRE_EXTINGUISHING': currentIcon = '🔥'; break;
                default: currentIcon = '📍';
            }
        }

        // Обновление поля растения
        function updatePlantField() {
            const plantInput = document.getElementById('plantInput');
            const action = document.getElementById('action').value;
            setIcon();

            if(action === 'PLANTING') {
                plantInput.removeAttribute('readonly');
                plantInput.value = '';
            } else {
                plantInput.setAttribute('readonly', 'readonly');
                plantInput.value = '';
            }
        }

        // Обработка клика по карте для новой задачи
        map.addEventListener('click', function (e) {
            const rect = this.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // Устанавливаем координаты в скрытые поля
            document.getElementById('coordX').value = Math.round(x);
            document.getElementById('coordY').value = Math.round(y);

            // Позиционируем маркер задачи
            taskMarker.innerText = currentIcon;
            taskMarker.style.left = (x - 15) + 'px'; // 15px = половина размера иконки
            taskMarker.style.top = (y - 15) + 'px';
            taskMarker.style.display = 'block';
        });

        // Функция для отображения существующих деревьев
        function renderTrees() {
            // trees должен быть передан из Thymeleaf
            const trees = /*[[${trees}]]*/ [];

            // Очищаем контейнер
            markersContainer.innerHTML = '';

            // Добавляем каждое дерево
            trees.forEach(tree => {
                const marker = document.createElement('div');
                marker.className = 'tree-marker';
                marker.dataset.id = tree.id;
                marker.style.position = 'absolute';
                marker.style.left = (tree.coordX - 20) + 'px'; // 20px = половина ширины картинки
                marker.style.top = (tree.coordY - 20) + 'px'; // 20px = половина высоты картинки

                // Создаем изображение дерева
                const img = document.createElement('img');
                img.src = '/assets/plants/' + tree.plant.imageFilename;
                img.style.width = '40px';
                img.style.height = '40px';
                img.style.objectFit = 'contain';
                img.style.pointerEvents = 'none';

                // Добавляем всплывающую подсказку
                img.title = tree.plant.name + ' (ID: ' + tree.id + ')';

                marker.appendChild(img);
                markersContainer.appendChild(marker);
            });
        }

        // Инициализация при загрузке страницы
        window.addEventListener('load', function() {
            updatePlantField();
            renderTrees(); // или renderTreesWithThymeleaf()

            // Ресайз картинки (если нужно)
            if (map.complete) {
                initMapSize();
            } else {
                map.addEventListener('load', initMapSize);
            }
        });
    </script>
</section>
</body>
</html>
