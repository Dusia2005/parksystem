<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
  <title>История задач</title>
</head>
<body>
<section layout:fragment="content">
  <div class="container mt-5">
    <h2>История завершённых задач</h2>
    <table class="table">
      <thead>
      <tr>
        <th>ID</th>
        <th>Описание</th>
        <th>Действие</th>
        <th>Растение</th>
        <th>Статус</th>
        <th>Отчёт</th>
        <th>Дата завершения</th>
        <th>Действия</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="task : ${tasks}">
        <td th:text="${task.id}"></td>
        <td th:text="${task.description}"></td>
        <td>
                  <span th:switch="${task.action.name}">
                    <span th:case="PLANTING">Посадка</span>
                    <span th:case="CUTTING">Вырубка</span>
                    <span th:case="WATERING">Полив</span>
                    <span th:case="FIRE_EXTINGUISHING">Тушение пожара</span>
                    <span th:case="PATROLLING">Обход</span>
                    <span th:case="*">Неизвестно</span>
                  </span>
        </td>
        <td th:text="${task.plant.name}"> </td>
        <td>
          <span th:if="${task.status.name() == 'COMPLETED'}" class="badge bg-success text-white">Выполнена</span>
        </td>
        <td>
                    <span th:if="${taskReports.containsKey(task.id)}"
                          th:text="${taskReports.get(task.id)}"></span>
          <span th:if="${!taskReports.containsKey(task.id)}">
                        <em>Отчёт отсутствует</em>
                    </span>
        </td>
        <td th:text="${#temporals.format(task.completedByOwnerAt, 'dd.MM.yyyy HH:mm')}"></td>
        <td>
          <form th:action="@{/tasks/delete/{id}(id=${task.id})}" method="post"
                onsubmit="return confirm('Вы уверены, что хотите удалить задачу?');">
            <button class="btn btn-danger btn-sm" type="submit">Удалить</button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</section>
</body>
</html>
