<!-- История задач -->
<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
  <title>История задач</title>
</head>
<body>
<section layout:fragment="content">
  <div class="container mt-5">
    <h2>История завершённых задач</h2>
    <table class="table">
      <thead>
      <tr>
        <th>ID</th>
        <th>Лесник</th>
        <th>Описание</th>
        <th>Действие</th>
        <th>Растение</th>
        <th>Статус</th>
        <th>Отчёт</th>
        <th>Дата начала - окончания</th>
        <th>Действия</th>
      </tr>
      </thead>
      <tbody>
      <!-- Перебор задач -->
      <tr th:each="task : ${tasks}">
        <td th:text="${task.id}"></td>
        <td th:text="${task.forester != null ? task.forester.username : '—'}"></td>
        <td th:text="${task.description}"></td>

        <!-- Отображение типа действия -->
        <td>
            <span th:switch="${task.action.name}">
              <span th:case="PLANTING">Посадка</span>
              <span th:case="CUTTING">Вырубка</span>
              <span th:case="WATERING">Полив</span>
              <span th:case="FIRE_EXTINGUISHING">Тушение пожара</span>
              <span th:case="PATROLLING">Обход</span>
              <span th:case="*">Неизвестно</span>
            </span>
        </td>

        <td th:text="${task.plant.name}"></td>

        <!-- Статус задачи -->
        <td>
          <span th:if="${task.status.name() == 'COMPLETED'}" class="badge bg-success text-white">Выполнена</span>
        </td>

        <!-- Отчёт по задаче -->
        <td>
            <span th:if="${task.reportText != null and !task.reportText.isEmpty()}"
                  th:text="${task.reportText}"></span>
          <span th:if="${task.reportText == null or task.reportText.isEmpty()}">
              <em>Отчёт отсутствует</em>
            </span>
        </td>

        <!-- Дата начала и окончания -->
        <td>
          <span th:text="${#temporals.format(task.createdAt, 'dd.MM.yyyy HH:mm')}"></span>
          &nbsp;-&nbsp;
          <span th:text="${#temporals.format(task.updatedAt, 'dd.MM.yyyy HH:mm')}"></span>
        </td>

        <!-- Действия над задачей -->
        <td>
          <div class="btn-group" role="group">
            <a th:href="@{/tasks/{id}/map(id=${task.id}, from='history')}" class="btn btn-primary btn-sm">Карта</a>
          </div>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</section>
</body>
</html>
