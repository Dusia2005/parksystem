<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Задачи</title>
</head>
<body>
<section layout:fragment="content">
    <div class="container mt-5">
        <h2>Список задач</h2>
        <table class="table">
            <thead>
            <tr><th>ID</th><th>Описание</th><th>Статус</th><th>Действия</th></tr>
            </thead>
            <tbody>
            <tr th:each="task : ${tasks}">
                <td th:text="${task.id}"></td>
                <td th:text="${task.description}"></td>
                <td th:text="${task.status}"></td>
                <td>
                    <form th:action="@{/tasks/approve/{id}(id=${task.id})}" method="post">
                        <button class="btn btn-success btn-sm" type="submit" th:if="${!task.approvedByOwner}">Подтвердить</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
