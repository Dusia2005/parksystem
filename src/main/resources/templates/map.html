<!-- Отображение карты -->
<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
  <title>Карта задачи</title>
</head>
<body>

    <section layout:fragment="content">
        <div class="container mt-5" style="max-width: 700px;">
            <h2>Карта задачи</h2>
            <!-- Описание задачи -->
            <p><strong>Описание:</strong> <span th:text="${task.description}"></span></p>
            <!-- Карта -->
            <div id="mapWrapper" style="position: relative; display: inline-block;">
                <img id="mapImage" src="/assets/les.jpg"
                     style="width: 100%; max-width: 600px; display: block;"/>
                <!-- Деревья -->
                <div id="treesLayer"
                     style="position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;">
                </div>
                <!-- Маркер задачи -->
                <div id="taskMarker"
                     style="position:absolute; font-size:32px; z-index:10; pointer-events:none;">
                </div>
            </div>
            <!-- Кнопки -->
            <a th:if="${userRole == 'OWNER' and from == 'owner'}"
               th:href="@{/tasks/owner-tasks}" class="btn btn-secondary mt-3">Назад</a>

            <a th:if="${userRole == 'OWNER' and from == 'history'}"
               th:href="@{/tasks/history}" class="btn btn-secondary mt-3">Назад</a>

            <a th:if="${userRole == 'FORESTER'}"
               th:href="@{/tasks/forester-tasks}" class="btn btn-secondary mt-3">Назад</a>
        </div>
        <!-- JS -->
        <script th:inline="javascript">

            /* ----- ДАННЫЕ ----- */

            const taskX = [[${task.coordX}]];
            const taskY = [[${task.coordY}]];
            const action = /*[[${task.action.name}]]*/ "UNKNOWN";
            const trees = /*[[${trees}]]*/ [];
            /* ----- ИКОНКА ТЕКУЩЕЙ ЗАДАЧИ ----- */
            function chooseTaskIcon(action) {
                switch (action) {
                    case 'PLANTING': return '🌱';
                    case 'CUTTING': return '❌';
                    case 'WATERING': return '💧';
                    case 'FIRE_EXTINGUISHING': return '🔥';
                    case 'PATROLLING': return '🚶';
                    default: return '📍';
                }
            }
            const taskMarker = document.getElementById("taskMarker");
            taskMarker.innerText = chooseTaskIcon(action);
            /* ----- ОТОБРАЖЕНИЕ МАРКЕРА ЗАДАЧИ ----- */

            function positionTaskMarker() {
                const w = taskMarker.offsetWidth;
                const h = taskMarker.offsetHeight;

                taskMarker.style.left = (taskX - w / 2) + "px";
                taskMarker.style.top = (taskY - h / 2) + "px";
            }
            /* ----- ОТОБРАЖЕНИЕ ВСЕХ ДЕРЕВЬЕВ ----- */
            function renderTrees() {
                const container = document.getElementById("treesLayer");
                container.innerHTML = "";

                trees.forEach(tree => {
                    const el = document.createElement("div");
                    el.style.position = "absolute";
                    el.style.left = (tree.coordX - 20) + "px";
                    el.style.top = (tree.coordY - 20) + "px";
                    el.style.pointerEvents = "none";

                    const img = document.createElement("img");
                    img.src = "/assets/plants/" + tree.plant.imageFilename;
                    img.style.width = "40px";
                    img.style.height = "40px";
                    img.style.objectFit = "contain";
                    img.title = tree.plant.name + " (ID: " + tree.id + ")";

                    el.appendChild(img);
                    container.appendChild(el);
                });
            }
            /* ----- ИНИЦИАЛИЗАЦИЯ ----- */

            window.addEventListener("load", () => {
                renderTrees();
                positionTaskMarker();
            });
        </script>
    </section>
    </body>
    </html>
